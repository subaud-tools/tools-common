# .tools family standard: identical in every family repo. casebook's global
# hooks run this file; nothing needs installing.
pre-commit:
  commands:
    gofmt:
      glob: "*.go"
      run: |
        test -z "$(gofmt -l {staged_files})" || { gofmt -l {staged_files}; echo "gofmt needed; run just fmt"; exit 1; }
pre-push:
  commands:
    verify:
      run: just verify
