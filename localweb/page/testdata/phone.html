<!doctype html>
<meta charset="utf-8">
<style>html, body { margin: 0; background: #fff; } iframe { border: 0; display: block; margin: 0 auto; }</style>
<body>
<script type="module">
// A phone-width window: headless Chrome won't make one narrower than 500px,
// so the page under test (?src=) runs in an iframe ?w= wide, whose media
// queries answer to its own width. Its #result, if it writes one, is copied.
const q = new URLSearchParams(location.search);
const f = document.createElement('iframe');
f.width = q.get('w') || '390';
f.height = q.get('h') || '844';
f.src = q.get('src');
document.body.append(f);
await new Promise(r => f.addEventListener('load', r, { once: true }));
for (let i = 0; i < 200; i++) {
  const res = f.contentDocument && f.contentDocument.getElementById('result');
  if (res) {
    const out = document.createElement('pre');
    out.id = 'result';
    out.textContent = res.textContent;
    document.body.append(out);
    break;
  }
  await new Promise(r => setTimeout(r, 25));
}
</script>
