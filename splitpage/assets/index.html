<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<link rel="stylesheet" href="split.css">
</head>
<body data-socket="__SOCKET__" data-session="__SESSION__" data-restart="__RESTART__" data-take="__TAKE__" data-script="__SCRIPT__" data-layout="split" data-view="">
<div id="switch" role="tablist" aria-label="Show">
  <button id="show-terminal" type="button" role="tab">Terminal</button>
  <button id="show-pages" type="button" role="tab"><span class="switch-new" aria-label="A page not seen yet"></span>Pages</button>
</div>
<div id="term">
  <div id="stopped" hidden>
    <span id="stopped-text"></span>
    <button id="start-again" type="button">Start it again</button>
    <button id="take-here" type="button" hidden>Show it here</button>
  </div>
</div>
<div id="divider" role="separator" aria-orientation="vertical" aria-label="Drag to resize the panels">
  <div id="grip">
    <button id="close-term" type="button" title="Close the terminal: the tabs fill the window" aria-label="Close the terminal: the tabs fill the window">&#x25c0;</button>
    <button id="close-tabs" type="button" title="Close the tabs: the terminal fills the window" aria-label="Close the tabs: the terminal fills the window">&#x25b6;</button>
  </div>
</div>
<div id="tabs-panel">
  <div id="tabbar">
    <div id="tab-list" role="tablist"></div>
    <button id="reload" type="button" title="Reload this tab" aria-label="Reload this tab">&#x21bb;</button>
  </div>
  <div id="frames">
    <div id="tabs-empty">Pages an agent opens appear here.</div>
  </div>
</div>
<script type="module" src="split.js"></script>
</body>
</html>
